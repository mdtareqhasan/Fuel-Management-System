<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="#ffffff"/>

  <text x="1160" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#111827">Fuel Platform: System Architecture</text>
  <text x="1160" y="60" text-anchor="end" font-size="12" fill="#6b7280">Day 1 implementation (verified 2026-11-20)</text>

  <!-- Operator -->
  <rect x="180" y="45" width="200" height="50" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
  <text x="280" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Operator</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#4B5563">Browser</text>

  <!-- Compose boundary -->
  <rect x="30" y="125" width="1140" height="700" rx="16" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="1155" y="150" text-anchor="end" font-size="12" fill="#6B7280">Docker Compose · project fuel-platform · network fuel-net</text>

  <!-- Frontend -->
  <rect x="60" y="165" width="440" height="115" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.3"/>
  <text x="80" y="190" font-size="14" font-weight="700" fill="#0C447C">frontend</text>
  <text x="485" y="190" text-anchor="end" font-size="11" fill="#185FA5">Nginx + React + TypeScript · :80</text>
  <text x="80" y="218" font-size="12" fill="#1F2937">Static operator console (read-only dashboard)</text>
  <text x="80" y="244" font-size="12" fill="#1F2937">Nginx same-origin proxy: /api/*, /actuator/*</text>
  <text x="80" y="265" font-size="11" fill="#4B5563">Browser never calls the simulator directly</text>

  <!-- Backend -->
  <rect x="60" y="320" width="660" height="280" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.3"/>
  <text x="80" y="345" font-size="14" font-weight="700" fill="#085041">backend</text>
  <text x="705" y="345" text-anchor="end" font-size="11" fill="#0F6E56">Spring Boot · :8080</text>

  <rect x="80" y="370" width="180" height="80" rx="8" fill="#ffffff" stroke="#1D9E75"/>
  <text x="170" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">web</text>
  <text x="170" y="411" text-anchor="middle" font-size="11" fill="#374151">/api/dashboard</text>
  <text x="170" y="427" text-anchor="middle" font-size="11" fill="#374151">/api/system-status</text>

  <rect x="300" y="370" width="200" height="80" rx="8" fill="#ffffff" stroke="#1D9E75"/>
  <text x="400" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">ingestion</text>
  <text x="400" y="411" text-anchor="middle" font-size="11" fill="#374151">refresh scheduler</text>
  <text x="400" y="427" text-anchor="middle" font-size="11" fill="#374151">validation · cached snapshot</text>

  <rect x="540" y="370" width="160" height="80" rx="8" fill="#ffffff" stroke="#1D9E75"/>
  <text x="620" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">domain</text>
  <text x="620" y="408" text-anchor="middle" font-size="11" fill="#374151">WorldSnapshot</text>
  <text x="620" y="422" text-anchor="middle" font-size="11" fill="#374151">SimulationMode</text>
  <text x="620" y="436" text-anchor="middle" font-size="11" fill="#374151">DataQuality</text>

  <rect x="80" y="490" width="180" height="80" rx="8" fill="#ffffff" stroke="#6B7280" stroke-dasharray="5 4"/>
  <text x="170" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#4B5563">Planned (not built)</text>
  <text x="170" y="528" text-anchor="middle" font-size="10.5" fill="#6B7280">risk · forecasting · anomaly</text>
  <text x="170" y="543" text-anchor="middle" font-size="10.5" fill="#6B7280">recommendation · approval</text>
  <text x="170" y="558" text-anchor="middle" font-size="10.5" fill="#6B7280">command · audit · SSE</text>

  <rect x="300" y="490" width="200" height="80" rx="8" fill="#ffffff" stroke="#1D9E75"/>
  <text x="400" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">simulator adapter</text>
  <text x="400" y="531" text-anchor="middle" font-size="11" fill="#374151">typed REST client</text>
  <text x="400" y="547" text-anchor="middle" font-size="11" fill="#374151">error parsing · metrics</text>

  <rect x="540" y="490" width="160" height="80" rx="8" fill="#ffffff" stroke="#1D9E75"/>
  <text x="620" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">observability</text>
  <text x="620" y="531" text-anchor="middle" font-size="11" fill="#374151">health registry</text>
  <text x="620" y="547" text-anchor="middle" font-size="11" fill="#374151">Micrometer metrics</text>

  <!-- internal arrows -->
  <line x1="260" y1="410" x2="298" y2="410" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="500" y1="410" x2="538" y2="410" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="400" y1="450" x2="400" y2="488" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="500" y1="530" x2="538" y2="530" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Operator -> frontend -->
  <line x1="280" y1="95" x2="280" y2="163" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="290" y="135" font-size="11" fill="#374151">HTTP localhost:5173</text>
  <!-- frontend -> web -->
  <line x1="170" y1="280" x2="170" y2="368" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="180" y="304" font-size="11" fill="#374151">REST proxy</text>
  <text x="180" y="318" font-size="11" fill="#374151">GET /api/dashboard, /api/system-status</text>

  <!-- Simulator -->
  <rect x="300" y="680" width="300" height="100" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.3"/>
  <text x="450" y="706" text-anchor="middle" font-size="14" font-weight="700" fill="#633806">simulator-api</text>
  <text x="450" y="726" text-anchor="middle" font-size="11" fill="#854F0B">Official BUP image 1.0.0 · :8000</text>
  <text x="450" y="748" text-anchor="middle" font-size="12" fill="#1F2937">Source of fuel-world truth</text>
  <text x="450" y="766" text-anchor="middle" font-size="10.5" fill="#4B5563">inventory · demand · sim time · events · shipments</text>
  <line x1="400" y1="570" x2="400" y2="678" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="410" y="625" font-size="11" fill="#374151">REST GET /v1/instance, regions, depots,</text>
  <text x="410" y="640" font-size="11" fill="#374151">stations, routes, supply-arrivals,</text>
  <text x="410" y="655" font-size="11" fill="#374151">events, allocations</text>

  <!-- Postgres -->
  <rect x="80" y="680" width="180" height="100" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
  <text x="170" y="706" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">postgres</text>
  <text x="170" y="726" text-anchor="middle" font-size="11" fill="#4B5563">PostgreSQL 16</text>
  <text x="170" y="748" text-anchor="middle" font-size="10.5" fill="#374151">Day 1: health probe only</text>
  <text x="170" y="764" text-anchor="middle" font-size="10.5" fill="#374151">no domain persistence</text>
  <line x1="170" y1="600" x2="170" y2="678" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="180" y="645" font-size="11" fill="#374151">JDBC SELECT 1</text>

  <!-- Grafana / Prometheus -->
  <rect x="780" y="360" width="360" height="80" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.3"/>
  <text x="960" y="387" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">grafana</text>
  <text x="960" y="406" text-anchor="middle" font-size="11" fill="#534AB7">Grafana 12.0.2 · :3000</text>
  <text x="960" y="425" text-anchor="middle" font-size="10.5" fill="#374151">Prometheus datasource provisioned · no project dashboard JSON</text>

  <rect x="780" y="490" width="360" height="80" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.3"/>
  <text x="960" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">prometheus</text>
  <text x="960" y="536" text-anchor="middle" font-size="11" fill="#534AB7">Prometheus v3.5.0 · :9090</text>
  <text x="960" y="555" text-anchor="middle" font-size="10.5" fill="#374151">Scrapes backend every 10s</text>

  <line x1="960" y1="440" x2="960" y2="488" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="970" y="468" font-size="11" fill="#374151">query http://prometheus:9090</text>
  <line x1="778" y1="530" x2="702" y2="530" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="960" y="592" text-anchor="middle" font-size="11" fill="#374151">scrape: GET /actuator/prometheus (arrow to observability)</text>

  <!-- Legend -->
  <line x1="60" y1="850" x2="100" y2="850" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="110" y="854" font-size="11" fill="#4B5563">Implemented data flow</text>
  <rect x="270" y="841" width="40" height="18" rx="4" fill="none" stroke="#6B7280" stroke-dasharray="5 4"/>
  <text x="320" y="854" font-size="11" fill="#4B5563">Planned work</text>
  <text x="1160" y="854" text-anchor="end" font-size="11" fill="#6B7280">Tick = 15 simulated min (simulation clock) · freshness measured on the wall clock</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

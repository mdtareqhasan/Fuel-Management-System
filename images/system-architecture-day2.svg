    </marker>
  </defs>
  <rect width="1100" height="800" fill="#FFFFFF"/>

  <text x="1070" y="36" text-anchor="end" font-size="20" font-weight="700" fill="#111827">Fuel Supply Intelligence: System Architecture</text>

  <!-- Operator -->

  <rect x="340" y="765" width="22" height="14" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="370" y="776" font-size="11" fill="#4B5563">Planned</text>
  <rect x="450" y="765" width="22" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>

  <text x="350" y="368" text-anchor="middle" font-size="12" fill="#085041">simulator adapter · metrics</text>
  <text x="350" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#0F6E56">Implemented</text>
  <text x="350" y="414" text-anchor="middle" font-size="10.5" fill="#6B7280">/api/risk: implemented</text>


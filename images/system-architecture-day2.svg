  <line x1="300" y1="440" x2="300" y2="498" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="288" y="474" text-anchor="end" font-size="11" fill="#6B7280">planned</text>

  <line x1="300" y1="580" x2="300" y2="638" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="288" y="604" text-anchor="end" font-size="11" fill="#6B7280">POST shipment</text>

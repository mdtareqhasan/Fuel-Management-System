name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job at a time. The whole pipeline takes a few minutes, and running the
# backend and frontend jobs in parallel would compete for the same Docker
# layer cache on the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The Maven Wrapper is committed, so the build uses the same Maven
      # version locally and in CI.
      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend test, build and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci fails if the lockfile is out of sync with package.json, which is
      # exactly the check this project wants.
      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Unit tests
        run: npm run test
        working-directory: frontend

      - name: Type check and build
        run: npm run build
        working-directory: frontend

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only. The images are not pushed: this project ships as source and
      # a pinned compose file, not as a registry.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: fuel-platform-backend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: fuel-platform-frontend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4

      - name: Build the stack
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the backend to be healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' fuel-backend 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "backend healthy"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy"
          docker compose logs backend
          exit 1

      # The smoke test asserts the same facts a reviewer would check by hand:
      # the dashboard carries real simulator data and the metrics endpoint is
      # live.
      - name: Smoke test the endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/dashboard > /tmp/dashboard.json
          curl -fsS http://localhost:8080/api/system-status > /tmp/status.json
          curl -fsS http://localhost:8080/actuator/prometheus > /tmp/metrics.txt

          python3 - <<'PY'
          import json
          dashboard = json.load(open('/tmp/dashboard.json'))
          status = json.load(open('/tmp/status.json'))
          metrics = open('/tmp/metrics.txt').read()

          assert len(dashboard['stations']) == 4, dashboard['stations']
          assert len(dashboard['depots']) == 2, dashboard['depots']
          assert len(dashboard['routes']) == 6, dashboard['routes']
          assert status['data_quality'] == 'FRESH', status
          assert status['decision_eligible'] is True, status
          assert 'fuel_data_age_seconds' in metrics
          print('smoke test passed')
          PY

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

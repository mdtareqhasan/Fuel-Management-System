server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: fuel-platform
  jackson:
    # One naming rule for the whole API. The simulator speaks snake_case, so the
    # application's own responses speak it too. Mixing the two in one payload
    # makes the frontend guess, and a wrong guess is a null field that nobody
    # notices until it renders as "Unknown".
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fuelplatform}
    username: ${DB_USER:fuel}
    password: ${DB_PASSWORD:fuel_local_dev_only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    # Flyway owns the schema. Hibernate must never touch it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      # Publish percentiles so the status panel can read p95 directly from
      # the same registry that Prometheus scrapes. See ADR 006.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 500ms, 1s
  observations:
    annotations:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
  level:
    com.fuelplatform: INFO
    org.springframework.web: INFO
  file:
    name: ${LOG_FILE:logs/fuel-platform.log}

app:
  simulator:
    base-url: ${SIMULATOR_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${SIMULATOR_CONNECT_TIMEOUT_MS:1000}
    response-timeout-ms: ${SIMULATOR_RESPONSE_TIMEOUT_MS:2000}
  freshness:
    max-age-seconds: ${FRESHNESS_MAX_AGE_SECONDS:10}
    min-refresh-interval-ms: ${REFRESH_MIN_INTERVAL_MS:500}
    poll-interval-ms: ${POLL_INTERVAL_MS:2000}
  projection:
    horizon-hours: ${PROJECTION_HORIZON_HOURS:8}

  # ------------------------------------------------------------------
  # RESILIENCE — timeout, retry and circuit breaker, kept apart.
  #
  # The simulator's measured baseline response is ~2.05 s, and the backend's
  # read timeout is 2 s. So a single clean read already sits on the timeout
  # boundary, and the freshness limit is 10 s.
  #
  # That arithmetic sets the retry bound. Three attempts at a 2 s deadline
  # span ~6 s, which still fits inside the 10 s freshness window. Five
  # attempts would not, and a retry policy that outlives the freshness
  # window hands the operator a view that expired while the retry was
  # still running — worse than no retry at all.
  # ------------------------------------------------------------------
  resilience:
    # Consecutive transport failures that open the breaker. A domain error
    # never counts: it is a correct answer from a reachable simulator.
    failure-threshold: ${RESILIENCE_FAILURE_THRESHOLD:3}
    # How long the breaker stays open before it allows a probe.
    open-seconds: ${RESILIENCE_OPEN_SECONDS:30}
    # How many probes the half-open state allows.
    half-open-probes: ${RESILIENCE_HALF_OPEN_PROBES:1}
    # Additional attempts after the first, for READS only. Writes are never
    # retried here: the command worker owns that decision, because only it
    # knows whether the command body was persisted before the POST.
    max-retries: ${RESILIENCE_MAX_RETRIES:1}
    # Base backoff between read retries.
    retry-backoff-ms: ${RESILIENCE_RETRY_BACKOFF_MS:250}

  # ------------------------------------------------------------------
  # EVENT STREAM — the simulator's SSE feed is a HINT, never the truth.
  #
  # The REST poll above always runs. The stream only makes the refresh
  # happen sooner, and a dropped or disconnected stream changes nothing
  # except how quickly the view updates.
  # ------------------------------------------------------------------
  stream:
    enabled: ${STREAM_ENABLED:true}
    connect-timeout-ms: ${STREAM_CONNECT_TIMEOUT_MS:1000}
    reconnect-delay-ms: ${STREAM_RECONNECT_DELAY_MS:2000}
    max-reconnect-delay-ms: ${STREAM_MAX_RECONNECT_DELAY_MS:30000}
    # A reconnect that succeeds within this window counts as a blip rather
    # than an outage.
    outage-threshold-ms: ${STREAM_OUTAGE_THRESHOLD_MS:10000}

  # ------------------------------------------------------------------
  # SIMULATOR PROFILE CONSTANTS — simulator-specific, not business rules.
  #
  # These are the numbers the official simulator uses to generate demand.
  # They are the denominator of every anomaly ratio, so a wrong value makes
  # the detector flag normal hours as anomalies.
  #
  # Every value below was RE-MEASURED against the running simulator on
  # 2026-11-21, not copied from the PDF. The measurement script is
  # scripts/measure_hour_factor.py and the output is kept in
  # docs/evidence/day-02/.
  #
  # The measurement caught a transcription error: the guide's highway busy
  # window is 06-09 (six hours wide), not 07-09. With the narrow window,
  # hour 6 of every day produced a 2.0 ratio and a permanent false alarm.
  # ------------------------------------------------------------------
  simulator-profile:
    version: measured-2026-11-21
    profiles:
      - name: urban_high
        diesel-daily-liters: 8500
        petrol-daily-liters: 10500
        octane-daily-liters: 5600
        noise-factor: 0.10
        busy-factor: 1.45
        off-peak-factor: 0.70
        busy-hour-ranges:
          - "07-09"
          - "16-20"
      - name: industrial
        diesel-daily-liters: 14000
        petrol-daily-liters: 4500
        octane-daily-liters: 2200
        noise-factor: 0.08
        busy-factor: 1.55
        off-peak-factor: 0.45
        busy-hour-ranges:
          - "06-17"
      - name: highway
        diesel-daily-liters: 10500
        petrol-daily-liters: 11000
        octane-daily-liters: 6200
        noise-factor: 0.12
        busy-factor: 1.35
        off-peak-factor: 0.75
        busy-hour-ranges:
          - "06-09"
          - "16-20"
      - name: regional
        diesel-daily-liters: 7200
        petrol-daily-liters: 7600
        octane-daily-liters: 3600
        noise-factor: 0.10
        busy-factor: 1.25
        off-peak-factor: 0.65
        busy-hour-ranges:
          - "07-20"

  # ------------------------------------------------------------------
  # FORECAST POLICY — proposed starting values, not tuned parameters.
  # Day 5 measures whether the EWMA actually beats the naive baseline.
  # ------------------------------------------------------------------
  forecast:
    ewma-alpha: ${FORECAST_EWMA_ALPHA:0.3}
    window-size: ${FORECAST_WINDOW_SIZE:8}
    minimum-observations: ${FORECAST_MIN_OBSERVATIONS:4}
    stress-multiplier: ${FORECAST_STRESS_MULTIPLIER:1.25}

  # ------------------------------------------------------------------
  # RISK AND ANOMALY POLICY — also proposed, not tuned.
  # ADR 005 records that the thresholds are guesses until a replay measures
  # the false-flag count and the detection delay.
  # ------------------------------------------------------------------
  risk:
    horizon-hours: ${RISK_HORIZON_HOURS:8}
    critical-hours: ${RISK_CRITICAL_HOURS:2}
    anomaly-consecutive-ticks: ${RISK_ANOMALY_TICKS:3}
    anomaly-ratio-threshold: ${RISK_ANOMALY_RATIO:1.35}
    recovery-ratio-threshold: ${RISK_RECOVERY_RATIO:1.15}
    regional-station-threshold: ${RISK_REGIONAL_STATIONS:2}

  # ------------------------------------------------------------------
  # APPROVAL POLICY — ADR 004.
  #
  # The wall-clock freshness limit is the one rule that behaves identically in
  # both modes: a decision cannot be made against a world the operator cannot
  # see. Ten seconds is short enough that the screen still describes the
  # current world.
  #
  # The proposal expiry only applies in RUNNING mode. At the measured rate of
  # ~5.46 ticks/sec and 15 simulated minutes per tick, ~82 simulated minutes
  # pass per wall second, so a 120 second review spans ~2.7 simulated days.
  # ------------------------------------------------------------------
  decision:
    wall-clock-freshness-seconds: ${DECISION_FRESHNESS_SECONDS:10}
    running-proposal-expiry-seconds: ${DECISION_EXPIRY_SECONDS:120}
    paused-max-tick-lag: ${DECISION_PAUSED_TICK_LAG:1}
    max-approved-quantity-liters: ${DECISION_MAX_QUANTITY:50000}

# Prometheus scrape configuration for the local stack.
#
# The backend is the only service worth scraping: the simulator is an external
# dependency whose behaviour we measure through the application's own metrics.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local-demo

# The alerting rules are code, not console clicks. Each rule names the condition
# it fires on and the runbook that explains what to do about it.
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: fuel-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: fuel-platform-backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
